name: WAGRAM AI Live Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-test:
    name: Run WAGRAM AI tests on the VPS
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      WAGRAM_APP_DIR: /opt/waTelegramConnector
      SQLITE_PATH: /opt/waTelegramConnector/data/bridge.db
      OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash-1017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VPS app, database, and OpenRouter configuration
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WAGRAM_APP_DIR"
          test -f "$SQLITE_PATH"
          test -f "$WAGRAM_APP_DIR/node_modules/better-sqlite3/package.json"
          cd "$WAGRAM_APP_DIR"
          node --input-type=module -e "import \"dotenv/config\"; if (!process.env.OPENROUTER_API_KEY) { console.error(\"OPENROUTER_API_KEY is missing from the VPS environment.\"); process.exit(1); } console.log(\"OpenRouter API key is configured.\");"
          echo "VPS application, SQLite database, dependencies, and OpenRouter configuration are ready."

      - name: Run Premium C WAGRAM AI tests
        run: node "$GITHUB_WORKSPACE/.github/scripts/wagram-ai-live-test.mjs"
