name: WAGRAM AI Live Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-test:
    name: Run WAGRAM AI tests on the VPS
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      WAGRAM_APP_DIR: /opt/waTelegramConnector
      SQLITE_PATH: /opt/waTelegramConnector/data/bridge.db
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:4b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VPS app, database, and Ollama
        shell: bash
        run: |
          set -euo pipefail
          test -d "$WAGRAM_APP_DIR"
          test -f "$SQLITE_PATH"
          test -f "$WAGRAM_APP_DIR/node_modules/better-sqlite3/package.json"
          curl --fail --silent --show-error "$OLLAMA_URL/api/tags" >/dev/null
          echo "VPS application, SQLite database, dependencies, and Ollama are reachable."

      - name: Run Premium C WAGRAM AI tests
        run: node "$GITHUB_WORKSPACE/.github/scripts/wagram-ai-live-test.mjs"
