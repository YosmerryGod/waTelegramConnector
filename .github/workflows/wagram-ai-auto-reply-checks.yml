name: WAGRAM AI Auto Reply Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/ai/auto-reply.js"
      - "src/ai/customer-service.js"
      - "src/telegram.js"
      - ".github/scripts/wagram-ai-auto-reply-idempotency-test.mjs"
      - ".github/workflows/wagram-ai-auto-reply-checks.yml"
  pull_request:
    paths:
      - "src/ai/auto-reply.js"
      - "src/ai/customer-service.js"
      - "src/telegram.js"
      - ".github/scripts/wagram-ai-auto-reply-idempotency-test.mjs"
      - ".github/workflows/wagram-ai-auto-reply-checks.yml"

jobs:
  auto-reply-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check src/ai/auto-reply.js
          node --check src/ai/customer-service.js
          node --check src/telegram.js
          node --check .github/scripts/wagram-ai-auto-reply-idempotency-test.mjs

      - name: Test durable auto-reply idempotency
        run: node .github/scripts/wagram-ai-auto-reply-idempotency-test.mjs
